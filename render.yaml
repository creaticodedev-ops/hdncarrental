# Render Blueprint — HDN Car API
# Docs: https://render.com/docs/blueprint-spec
#
# Custom domain api.hdncar.com (Cloudflare DNS → this service):
# 1. Render → Custom Domains → api.hdncar.com (certificate via Google Trust Services).
# 2. Cloudflare DNS: CNAME api → <this-service>.onrender.com
#    Keep DNS-only (grey cloud) until Render shows the certificate as issued.
# 3. After the cert is Issued, Proxy status may be Proxied (orange cloud).
# 4. Cloudflare SSL/TLS mode must be Full or Full (strict) — never Flexible.
#    Flexible (HTTP to origin) causes redirect loops and mixed TLS.
# 5. Do not install a Cloudflare Origin CA on Render. Browsers do not trust it
#    unless Cloudflare is proxying. Render already terminates HTTPS.
services:
  - type: web
    name: americonfort-api
    runtime: node
    rootDir: server
    plan: starter
    buildCommand: npm install && npm run install:chrome
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      # Keep Puppeteer cache inside the deployed project tree (build → runtime).
      - key: PUPPETEER_CACHE_DIR
        value: /opt/render/project/src/.cache/puppeteer
      # Optional override if using a system Chrome binary instead of Puppeteer Chrome:
      # - key: PUPPETEER_EXECUTABLE_PATH
      #   value: /usr/bin/google-chrome-stable
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: API_PUBLIC_URL
        sync: false
